<div class="layout">

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar">
    <div class="navbar-left">
      <div class="logo" routerLink="/dashboard/overview" style="cursor: pointer;" title="Retour au tour de contrôle">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="9 22 9 12 15 12 15 22" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="logo-text">Custodix</span>
        <span class="logo-badge">PRO</span>
      </div>
    </div>

    <div class="navbar-center">
      <span class="nav-subtitle">VERMEG — Supervision des flux financiers</span>
    </div>

    <div class="navbar-right">
      <!-- Toggle Dark / Light -->
      <button class="theme-toggle" (click)="themeService.toggle()" [title]="themeService.isDark() ? 'Mode clair' : 'Mode sombre'">
        <span class="theme-toggle-track" [class.light]="!themeService.isDark()">
          <span class="theme-toggle-thumb">
            <span class="theme-icon">{{ themeService.isDark() ? '🌙' : '☀️' }}</span>
          </span>
        </span>
        <span class="theme-label">{{ themeService.isDark() ? 'Dark' : 'Light' }}</span>
      </button>

      <!-- Avatar utilisateur -->
      <div class="user-avatar" title="VERMEG User">VG</div>
    </div>
  </nav>

  <div class="main">
    <!-- ===== CONTENU PRINCIPAL ===== -->
    <main class="content">
      <router-outlet />
    </main>

    <!-- ===== FLOATING ROADMAP CAPSULE (VANILLA CSS WOW) ===== -->
    <div class="floating-roadmap-wrapper">
      <div class="floating-capsule">
        <ng-container *ngFor="let step of steps; let i = index; let isLast = last">
          <!-- Step Node -->
          <div class="capsule-node" 
               [class]="getStepState(step, i)"
               [routerLink]="step.status !== 'disabled' ? [step.route] : null">
            
            <div class="node-icon-wrapper">
              <svg class="node-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path [attr.d]="step.iconPath" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              <!-- Glowing effect background -->
              <div class="node-glow"></div>
            </div>
            
            <div class="node-label-wrapper">
              <span class="node-label">{{ step.label }}</span>
              <span class="node-badge" *ngIf="step.badge" [class.is-ai]="step.isAi">{{ step.badge }}</span>
            </div>
          </div>

          <!-- Connecting Path -->
          <div class="capsule-path" *ngIf="!isLast">
            <div class="path-fill" [class.active]="getStepState(step, i) === 'completed'"></div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>

</div>
